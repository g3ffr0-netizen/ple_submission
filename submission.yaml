name: ple-submission
model_api: google-cloud/gemini-4-argon
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements-serve.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
env:
  MAX_OUTPUT_TOKENS: "32000"
  REASONING_EFFORT: "high"
  MAX_FIX_ROUNDS: "2"
  MAX_FAILURES: "3"
  MAX_RETRIES: "3"
  MAX_PLAN_TURNS: "18"
  MAX_WORK_TURNS: "55"
  MAX_VERIFY_TURNS: "25"
  MAX_FIX_TURNS: "30"
