name: PLE Kit Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ple-kit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Clone official PLE starter kit and install dependencies
        run: |
          rm -rf "$RUNNER_TEMP/ple_kit"
          git clone --depth 1 https://github.com/google-research/ple.git "$RUNNER_TEMP/ple_kit"
          cd "$RUNNER_TEMP/ple_kit"
          uv sync

      - name: Run kit validate on submission
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          uv run python -m kit validate "$GITHUB_WORKSPACE"

      - name: Run kit build and capture serve image
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          uv run python -m kit build "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/kit_build.log"
          SERVE_IMAGE=$(sed -n 's/.*serve image \([^[:space:]]*\).*/\1/p' "$RUNNER_TEMP/kit_build.log" | tail -n 1)
          if [ -z "$SERVE_IMAGE" ]; then
            echo "::error::Could not determine built serve image tag from kit build output"
            docker images
            exit 1
          fi
          echo "SERVE_IMAGE=$SERVE_IMAGE" >> "$GITHUB_ENV"
          echo "Built serve image: $SERVE_IMAGE"

      - name: Verify serve.py listens in hardened container
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          SERVE_CMD=$(uv run python -c "
          from kit import spec
          sub = spec.load('$GITHUB_WORKSPACE')
          print(spec.fill(sub.serve, 8765))
          ")
          echo "Starting container with serve command: $SERVE_CMD"
          docker rm -f ple-ci-serve || true
          docker run -d \
            --name ple-ci-serve \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1g,mode=1777 \
            --tmpfs /home/harness:rw,exec,nosuid,size=1g,uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:8765:8765 \
            -e PORT=8765 \
            -e HOME=/home/harness \
            -e USER=harness \
            -e MODEL_NAME=gemini-3.8-flash \
            -e OPENAI_BASE_URL=http://127.0.0.1:4000/v1 \
            -e OPENAI_API_KEY=ci-probe-placeholder \
            "$SERVE_IMAGE" \
            bash -c "$SERVE_CMD"

          uv run python -c "
          import asyncio, json, time
          import websockets

          async def probe():
              deadline = time.monotonic() + 30.0
              last_err = None
              while time.monotonic() < deadline:
                  try:
                      async with websockets.connect(
                          'ws://127.0.0.1:8765',
                          max_size=16 << 20,
                          ping_interval=None,
                      ) as ws:
                          await ws.send(json.dumps({'type': 'probe'}))
                          raw = await asyncio.wait_for(ws.recv(), timeout=5.0)
                          msg = json.loads(raw)
                          assert msg.get('type') == 'error', msg
                          assert 'expected a task message first' in msg.get('message', ''), msg
                          print('Listen probe response OK:', msg)
                          return
                  except Exception as exc:
                      last_err = exc
                      await asyncio.sleep(0.5)
              raise RuntimeError(f'WebSocket probe failed within 30s: {last_err}')

          asyncio.run(probe())
          "

          LOGS=$(docker logs ple-ci-serve 2>&1)
          echo "$LOGS"
          printf '%s\n' "$LOGS" | grep -q "listening on 8765"
          RUNNING=$(docker inspect -f '{{.State.Running}}' ple-ci-serve)
          test "$RUNNING" = "true"

      - name: Verify PLE Protocol v1 dry-run task lifecycle in built container
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          docker rm -f ple-ci-dryrun || true
          docker run -d \
            --name ple-ci-dryrun \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1g,mode=1777 \
            --tmpfs /home/harness:rw,exec,nosuid,size=1g,uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:8766:8765 \
            -e PORT=8765 \
            -e HOME=/home/harness \
            -e USER=harness \
            "$SERVE_IMAGE" \
            /opt/harness/venv/bin/python /opt/harness/src/serve.py --dry-run

          uv run python -c "
          import asyncio, base64, json, time
          import websockets

          async def drive():
              deadline = time.monotonic() + 30.0
              ws = None
              last_err = None
              while time.monotonic() < deadline:
                  try:
                      ws = await websockets.connect(
                          'ws://127.0.0.1:8766',
                          max_size=16 << 20,
                          ping_interval=None,
                      )
                      break
                  except Exception as exc:
                      last_err = exc
                      await asyncio.sleep(0.5)
              if ws is None:
                  raise RuntimeError(f'Could not connect to dry-run container: {last_err}')

              files = {}
              counts = {'exec': 0, 'read_file': 0, 'write_file': 0, 'log': 0, 'usage': 0}
              async with ws:
                  await ws.send(json.dumps({
                      'type': 'task',
                      'protocol': 1,
                      'session': 'ci-dryrun',
                      'instruction': 'Write HELLO to /app/hello.txt and summarize.',
                      'workdir': '/app',
                      'limits': {'agent_timeout_sec': 120, 'exec_timeout_sec': 60},
                      'mcp_servers': [],
                  }))
                  while True:
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=15.0))
                      kind = msg.get('type')
                      if kind in ('log', 'usage'):
                          counts[kind] += 1
                          continue
                      if kind == 'done':
                          assert str(msg.get('final_message', '')).strip(), msg
                          assert files.get('/app/hello.txt') == b'HELLO\n', files
                          print('Dry-run Protocol v1 lifecycle OK:', counts, msg['final_message'])
                          return
                      if kind == 'error':
                          raise AssertionError(f'Unexpected error frame: {msg}')
                      rid = msg['id']
                      counts[kind] = counts.get(kind, 0) + 1
                      if kind == 'exec':
                          reply = {'type': 'result', 'id': rid, 'ok': True, 'exit_code': 0, 'output': '/app\n', 'truncated': False, 'timed_out': False}
                      elif kind == 'read_file':
                          data = files.get(msg['path'])
                          if data is None:
                              reply = {'type': 'result', 'id': rid, 'ok': False, 'error': 'missing'}
                          else:
                              reply = {'type': 'result', 'id': rid, 'ok': True, 'content_b64': base64.b64encode(data).decode(), 'size': len(data), 'truncated': False}
                      elif kind == 'write_file':
                          data = base64.b64decode(msg['content_b64'])
                          prev = files.get(msg['path'], b'') if msg.get('append') else b''
                          files[msg['path']] = prev + data
                          reply = {'type': 'result', 'id': rid, 'ok': True, 'size': len(files[msg['path']])}
                      else:
                          reply = {'type': 'result', 'id': rid, 'ok': False, 'error': f'unsupported {kind}'}
                      await ws.send(json.dumps(reply))

          asyncio.run(drive())
          "

      - name: Run official kit check --no-smoke --cancel-test (zero-cost local mock proxy)
        run: |
          python3 -u - <<'PY' >"$RUNNER_TEMP/mock_openai.log" 2>&1 &
          import json
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class MockOpenAIHandler(BaseHTTPRequestHandler):
              def _send_json(self, code: int, payload: dict) -> None:
                  raw = json.dumps(payload).encode("utf-8")
                  try:
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)
                  except (BrokenPipeError, ConnectionResetError):
                      pass

              def do_GET(self) -> None:
                  if self.path.rstrip("/").endswith("/models"):
                      self._send_json(
                          200,
                          {
                              "object": "list",
                              "data": [{"id": "gemini-4-argon", "object": "model"}],
                          },
                      )
                  else:
                      self._send_json(404, {"error": "not found"})

              def do_POST(self) -> None:
                  length = int(self.headers.get("Content-Length") or 0)
                  raw_body = self.rfile.read(length) if length > 0 else b"{}"
                  try:
                      body = json.loads(raw_body.decode("utf-8", errors="replace"))
                  except Exception:
                      body = {}
                  msgs_str = json.dumps(body.get("messages") or [])
                  if "Reply with the word OK." in msgs_str:
                      self._send_json(
                          200,
                          {
                              "id": "chatcmpl-ci-probe",
                              "object": "chat.completion",
                              "created": 1700000000,
                              "model": body.get("model") or "gemini-4-argon",
                              "choices": [
                                  {
                                      "index": 0,
                                      "message": {"role": "assistant", "content": "OK"},
                                      "finish_reason": "stop",
                                  }
                              ],
                              "usage": {
                                  "prompt_tokens": 8,
                                  "completion_tokens": 1,
                                  "total_tokens": 9,
                              },
                          },
                      )
                      return
                  # Hold non-probe requests mid-turn past cancel_after=45s so --cancel-test
                  # exercises real in-flight cancellation without spending any LLM credits.
                  for _ in range(110):
                      time.sleep(0.5)
                  self._send_json(
                      200,
                      {
                          "id": "chatcmpl-ci-cancel",
                          "object": "chat.completion",
                          "created": 1700000000,
                          "model": body.get("model") or "gemini-4-argon",
                          "choices": [
                              {
                                  "index": 0,
                                  "message": {"role": "assistant", "content": "Working..."},
                                  "finish_reason": "stop",
                              }
                          ],
                          "usage": {
                              "prompt_tokens": 16,
                              "completion_tokens": 2,
                              "total_tokens": 18,
                          },
                      },
                  )

              def log_message(self, fmt: str, *args) -> None:
                  print(fmt % args, flush=True)

          server = ThreadingHTTPServer(("0.0.0.0", 4000), MockOpenAIHandler)
          print("MOCK_OPENAI_READY", flush=True)
          server.serve_forever()
          PY
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true; rm -f "$RUNNER_TEMP/mock_proxy.env"' EXIT

          for _ in $(seq 1 30); do
            if grep -q "MOCK_OPENAI_READY" "$RUNNER_TEMP/mock_openai.log" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done

          umask 077
          cat > "$RUNNER_TEMP/mock_proxy.env" <<'EOF'
          MODEL_PROXY_URL=http://localhost:4000
          MODEL_PROXY_KEY=ci-zero-cost-mock-proxy
          EOF

          cd "$RUNNER_TEMP/ple_kit"
          uv run python -m kit check "$GITHUB_WORKSPACE" --no-smoke --cancel-test --env-file "$RUNNER_TEMP/mock_proxy.env"

      - name: Run kit artifacts on submission (strict once artifacts/ exists)
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          set +e
          uv run python -m kit artifacts "$GITHUB_WORKSPACE"
          RC=$?
          set -e
          if [ -d "$GITHUB_WORKSPACE/artifacts" ]; then
            exit "$RC"
          fi
          echo "::notice::artifacts/ does not exist yet (kit artifacts exited with $RC); keeping check non-blocking until dev artifacts are populated."

      - name: Clean up containers and print logs on failure
        if: always()
        run: |
          for name in ple-ci-serve ple-ci-dryrun; do
            if docker container inspect "$name" >/dev/null 2>&1; then
              echo "=== $name logs ==="
              docker logs "$name" 2>&1 || true
            fi
          done
          docker rm -f ple-ci-serve ple-ci-dryrun >/dev/null 2>&1 || true
