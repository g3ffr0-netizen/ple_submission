@@ -280,6 +330,104 @@ jobs:
           cd "$RUNNER_TEMP/ple_kit"
           uv sync
 
+      - name: Resolve dev task dataset metadata
+        id: task_meta
+        env:
+          HF_TOKEN: ${{ secrets.HF_TOKEN }}
+          TASK_ID: ${{ matrix.task_id }}
+        run: |
+          cd "$RUNNER_TEMP/ple_kit"
+          uv run python - <<'PY'
+          import hashlib, os, sys
+          from pathlib import Path
+          import yaml
+          sys.path.insert(0, os.getcwd())
+          from eval import run as eval_run
+          dev_set = yaml.safe_load(Path("eval/dev_set.yaml").read_text(encoding="utf-8"))
+          tasks_by_id = {t["id"]: t for t in dev_set["tasks"]}
+          task_id = os.environ["TASK_ID"]
+          grading = tasks_by_id[task_id].get("grading", "unknown")
+          repo = eval_run.dataset_repo()
+          try:
+              rev = eval_run.latest_revision(repo, os.environ.get("HF_TOKEN"))
+          except Exception:
+              rev = str(dev_set.get("tasks_revision") or "latest")
+          df = Path("kit/builder/Dockerfile")
+          btag = "plebench-builder:" + hashlib.sha256(df.read_bytes() + b"linux/amd64").hexdigest()[:16]
+          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
+              fh.write(f"hf_rev={rev}\n")
+              fh.write(f"grading={grading}\n")
+              fh.write(f"builder_tag={btag}\n")
+          print(f"Resolved task={task_id} grading={grading} hf_rev={rev[:12]} builder_tag={btag}")
+          PY
+
+      - name: Cache Hugging Face task files (~45-150 MB per task)
+        uses: actions/cache@v4
+        with:
+          path: ~/.cache/plebench/tasks
+          key: ple-hf-${{ steps.task_meta.outputs.hf_rev }}-${{ matrix.task_id }}
+
+      - name: Log in to GitHub Container Registry (GHCR)
+        uses: docker/login-action@v3
+        with:
+          registry: ghcr.io
+          username: ${{ github.actor }}
+          password: ${{ secrets.GITHUB_TOKEN }}
+
+      - name: Pre-warm builder and task Docker layers from GHCR
+        env:
+          HF_TOKEN: ${{ secrets.HF_TOKEN }}
+          TASK_ID: ${{ matrix.task_id }}
+          TASK_GRADING: ${{ steps.task_meta.outputs.grading }}
+          BUILDER_TAG: ${{ steps.task_meta.outputs.builder_tag }}
+        run: |
+          REPO_LC="${GITHUB_REPOSITORY,,}"
+
+          # 1. Pull cached plebench-builder image (skips ~60s rebuild per matrix job)
+          if docker pull "ghcr.io/${REPO_LC}/${BUILDER_TAG}"; then
+            docker tag "ghcr.io/${REPO_LC}/${BUILDER_TAG}" "${BUILDER_TAG}"
+          fi
+
+          # 2. Ensure HF task directory is present and compute exact eval/run.py task_image tag
+          cd "$RUNNER_TEMP/ple_kit"
+          eval "$(uv run python - <<'PY'
+          import os, shlex, sys
+          sys.path.insert(0, os.getcwd())
+          from eval import run as eval_run
+          tid = os.environ["TASK_ID"]
+          found = eval_run.resolve_tasks([tid], None, {"HF_TOKEN": os.environ.get("HF_TOKEN", "")})
+          env_dir = found[tid] / "environment"
+          tag = f"plebench-task-{tid}:{eval_run.tree_sha256(env_dir)[:20]}"
+          has_df = "true" if (env_dir / "Dockerfile").is_file() else "false"
+          print(f"ENV_DIR={shlex.quote(str(env_dir))}")
+          print(f"TASK_TAG={shlex.quote(tag)}")
+          print(f"HAS_DOCKERFILE={has_df}")
+          PY
+          )"
+
+          # 3. Build/load into host daemon BuildKit (default builder) using GHCR registry cache
+          if [ "$HAS_DOCKERFILE" = "true" ]; then
+            CACHE_REF="ghcr.io/${REPO_LC}/plebench-cache:${TASK_ID}"
+            SHARED_REF="ghcr.io/${REPO_LC}/plebench-cache:shared-${TASK_GRADING}"
+            CACHE_TO_ARGS=()
+            if docker info --format '{{.DriverStatus}}' 2>/dev/null | grep -q 'io.containerd.snapshotter'; then
+              CACHE_TO_ARGS+=(--cache-to "type=registry,ref=${CACHE_REF},mode=max,oci-mediatypes=true,image-manifest=true")
+              if [ "$TASK_GRADING" = "rubric" ] && ! docker buildx imagetools inspect "$SHARED_REF" >/dev/null 2>&1; then
+                CACHE_TO_ARGS+=(--cache-to "type=registry,ref=${SHARED_REF},mode=max,oci-mediatypes=true,image-manifest=true")
+              fi
+            else
+              CACHE_TO_ARGS+=(--cache-to "type=inline")
+            fi
+
+            echo "Pre-warming ${TASK_TAG} from ${CACHE_REF} (shared: ${SHARED_REF}) ..."
+            DOCKER_BUILDKIT=1 docker buildx build \
+              --builder default \
+              --platform linux/amd64 \
+              --load \
+              --cache-from "type=registry,ref=${CACHE_REF}" \
+              --cache-from "type=registry,ref=${SHARED_REF}" \
+              "${CACHE_TO_ARGS[@]}" \
+              -t "${TASK_TAG}" \
+              "${ENV_DIR}" || echo "::warning::GHCR-cached pre-warm failed; eval/run.py will build locally"
+          fi
+
       - name: Start local Vertex AI model proxy
         env:
           HF_TOKEN: ${{ secrets.HF_TOKEN }}
