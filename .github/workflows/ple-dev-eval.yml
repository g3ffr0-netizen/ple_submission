name: PLE Dev Eval
on:
  workflow_dispatch:
    inputs:
      task_limit:
        description: "Number of public dev tasks to run (1-29; default 3 for smoke test, 29 for full dev set)"
        required: false
        default: "3"
        type: string
      max_parallel:
        description: "Maximum parallel task runners (1-6; default 3)"
        required: false
        default: "3"
        type: string
      commit_artifacts:
        description: "Commit merged artifacts/ back to origin/main when all selected tasks succeed"
        required: false
        default: false
        type: boolean
      tasks:
        description: "Optional comma-separated dev task IDs overriding task_limit (e.g. frame-extension-method,data-hall-device-takeoff)"
        required: false
        default: ""
        type: string
permissions:
  contents: write
jobs:
  plan-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tasks_json: ${{ steps.plan.outputs.tasks_json }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - name: Validate required secrets and inputs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
          TASK_LIMIT: ${{ inputs.task_limit }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          COMMIT_ARTIFACTS: ${{ inputs.commit_artifacts }}
          TASKS_INPUT: ${{ inputs.tasks }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          missing = [
              name
              for name in ("HF_TOKEN", "GCP_SA_KEY", "VERTEXAI_PROJECT")
              if not os.environ.get(name, "").strip()
          ]
          if missing:
              print(
                  f"::error::Missing required GitHub Repository Secrets: {', '.join(missing)}",
                  file=sys.stderr,
              )
              sys.exit(1)
          try:
              sa = json.loads(os.environ["GCP_SA_KEY"])
              assert isinstance(sa, dict) and sa.get("client_email") and sa.get("private_key")
          except Exception:
              print(
                  "::error::GCP_SA_KEY must be valid Google Cloud service account JSON.",
                  file=sys.stderr,
              )
              sys.exit(1)
          raw_limit = os.environ.get("TASK_LIMIT", "3").strip() or "3"
          try:
              limit = int(raw_limit)
          except ValueError:
              print(f"::error::task_limit must be an integer 1..29 (got {raw_limit!r})", file=sys.stderr)
              sys.exit(1)
          if not 1 <= limit <= 29:
              print(f"::error::task_limit must be between 1 and 29 (got {limit})", file=sys.stderr)
              sys.exit(1)
          raw_parallel = os.environ.get("MAX_PARALLEL", "3").strip() or "3"
          try:
              max_p = int(raw_parallel)
          except ValueError:
              print(f"::error::max_parallel must be an integer 1..6 (got {raw_parallel!r})", file=sys.stderr)
              sys.exit(1)
          if not 1 <= max_p <= 6:
              print(f"::error::max_parallel must be between 1 and 6 (got {max_p})", file=sys.stderr)
              sys.exit(1)
          print(
              f"Validated inputs: task_limit={limit}, max_parallel={max_p}, "
              f"commit_artifacts={os.environ.get('COMMIT_ARTIFACTS')}, "
              f"tasks={os.environ.get('TASKS_INPUT', '').strip()!r}"
          )
          PY
      - name: Check out submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Clone official PLE starter kit and install dependencies
        run: |
          rm -rf "$RUNNER_TEMP/ple_kit"
          git clone --depth 1 https://github.com/google-research/ple.git "$RUNNER_TEMP/ple_kit"
          cd "$RUNNER_TEMP/ple_kit"
          uv sync
      - name: Start local Vertex AI model proxy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
        run: |
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          key_path = Path(os.environ["RUNNER_TEMP"]) / "gcp-sa-key.json"
          key_path.write_text(os.environ["GCP_SA_KEY"], encoding="utf-8")
          os.chmod(key_path, 0o600)
          PY
          PROXY_KEY=$(openssl rand -hex 24)
          echo "::add-mask::$PROXY_KEY"
          echo "MODEL_PROXY_KEY=$PROXY_KEY" >> "$GITHUB_ENV"
          echo "MODEL_PROXY_URL=http://localhost:4000" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa-key.json" >> "$GITHUB_ENV"
          {
            printf 'MODEL_PROXY_URL=http://localhost:4000\n'
            printf 'MODEL_PROXY_KEY=%s\n' "$PROXY_KEY"
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
          } > "$RUNNER_TEMP/local.env"
          chmod 600 "$RUNNER_TEMP/local.env"
          export MODEL_PROXY_KEY="$PROXY_KEY"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa-key.json"
          bash "$RUNNER_TEMP/ple_kit/kit/model_proxy/start.sh" >"$RUNNER_TEMP/model_proxy.log" 2>&1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"
          for _ in $(seq 1 180); do
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "::error::kit/model_proxy/start.sh exited prematurely"
              tail -n 60 "$RUNNER_TEMP/model_proxy.log" || true
              exit 1
            fi
            if curl -fsS -H "Authorization: Bearer $PROXY_KEY" http://127.0.0.1:4000/v1/models >/dev/null 2>&1; then
              echo "Local Vertex AI model proxy is ready on http://0.0.0.0:4000"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Model proxy did not become ready within 180s"
          tail -n 60 "$RUNNER_TEMP/model_proxy.log" || true
          exit 1
      - name: Run official kit check --cancel-test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          uv run python -m kit check "$GITHUB_WORKSPACE" --cancel-test --env-file "$RUNNER_TEMP/local.env"
      - name: Plan dev task matrix
        id: plan
        env:
          TASK_LIMIT: ${{ inputs.task_limit }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          TASKS_INPUT: ${{ inputs.tasks }}
        run: |
          cd "$RUNNER_TEMP/ple_kit"
          uv run python - <<'PY'
          import json
          import os
          import sys
          import yaml
          from pathlib import Path
          raw_tasks = os.environ.get("TASKS_INPUT", "").strip()
          dev_set = yaml.safe_load((Path(os.environ["RUNNER_TEMP"]) / "ple_kit" / "eval" / "dev_set.yaml").read_text(encoding="utf-8"))
          tasks = dev_set["tasks"]
          known_ids = {t["id"] for t in tasks}
          if raw_tasks:
              requested = []
              for part in raw_tasks.split(","):
                  tid = part.strip()
                  if tid and tid not in requested:
                      requested.append(tid)
              if not requested:
                  print(f"::error::tasks input must contain at least one task id (got {raw_tasks!r})", file=sys.stderr)
                  sys.exit(1)
              unknown = [tid for tid in requested if tid not in known_ids]
              if unknown:
                  print(f"::error::Unknown task id(s): {', '.join(unknown)}", file=sys.stderr)
                  sys.exit(1)
              selected = requested
              max_p = min(len(selected), int(os.environ.get("MAX_PARALLEL", "3") or "3"))
          else:
              limit = int(os.environ.get("TASK_LIMIT", "3") or "3")
              max_p = min(limit, int(os.environ.get("MAX_PARALLEL", "3") or "3"))
              if limit >= len(tasks):
                  selected = [t["id"] for t in tasks]
              else:
                  ordered = sorted(
                      tasks,
                      key=lambda t: (0 if t.get("grading") == "checks" else (1 if t.get("grading") == "checks-judge" else 2)),
                  )
                  selected = [t["id"] for t in ordered[:limit]]
          print(f"Selected {len(selected)} task(s) with max_parallel={max_p}: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tasks_json={json.dumps(selected)}\n")
              fh.write(f"max_parallel={max_p}\n")
          PY
      - name: Stop model proxy and clean secret files
        if: always()
        run: |
          if [ -n "${PROXY_PID:-}" ]; then
            kill "$PROXY_PID" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/gcp-sa-key.json" "$RUNNER_TEMP/local.env"
  eval-task:
    needs: plan-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan-and-check.outputs.max_parallel) }}
      matrix:
        task_id: ${{ fromJson(needs.plan-and-check.outputs.tasks_json) }}
    steps:
      - name: Check out submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reclaim runner disk space for container images
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and Harbor
        run: |
          python -m pip install --upgrade pip uv
          uv tool install harbor==0.20.0 --with websockets
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone official PLE starter kit and install dependencies
        run: |
          rm -rf "$RUNNER_TEMP/ple_kit"
          git clone --depth 1 https://github.com/google-research/ple.git "$RUNNER_TEMP/ple_kit"
          cd "$RUNNER_TEMP/ple_kit"
          uv sync
      - name: Start local Vertex AI model proxy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
        run: |
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          key_path = Path(os.environ["RUNNER_TEMP"]) / "gcp-sa-key.json"
          key_path.write_text(os.environ["GCP_SA_KEY"], encoding="utf-8")
          os.chmod(key_path, 0o600)
          PY
          PROXY_KEY=$(openssl rand -hex 24)
          echo "::add-mask::$PROXY_KEY"
          echo "MODEL_PROXY_KEY=$PROXY_KEY" >> "$GITHUB_ENV"
          echo "MODEL_PROXY_URL=http://localhost:4000" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa-key.json" >> "$GITHUB_ENV"
          {
            printf 'MODEL_PROXY_URL=http://localhost:4000\n'
            printf 'MODEL_PROXY_KEY=%s\n' "$PROXY_KEY"
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
          } > "$RUNNER_TEMP/local.env"
          chmod 600 "$RUNNER_TEMP/local.env"
          export MODEL_PROXY_KEY="$PROXY_KEY"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa-key.json"
          bash "$RUNNER_TEMP/ple_kit/kit/model_proxy/start.sh" >"$RUNNER_TEMP/model_proxy.log" 2>&1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"
          for _ in $(seq 1 180); do
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "::error::kit/model_proxy/start.sh exited prematurely"
              tail -n 6
