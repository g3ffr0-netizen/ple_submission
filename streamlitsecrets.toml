GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"
```[cite: 59]

The TOML syntax on that line is valid, **but** there are two fixes needed for Streamlit to actually use it properly and keep your setup clean[cite: 59]:

### 1. Fix the File Path & Name
Streamlit does **not** automatically load a file named `streamlitsecrets.toml` at the repository root[cite: 59]. It looks for a TOML file at:
* `.streamlit/secrets.toml` (with a dot in front of `streamlit` and a slash before `secrets.toml`)

If you want to keep a placeholder file in [GitHub](https://github.com/) as a reference, name it `.streamlit/secrets.toml.example` (or `secrets.toml.example`), and put your real untracked file at `.streamlit/secrets.toml` locally (making sure `.streamlit/secrets.toml` is in `.gitignore`).

### 2. What Goes Inside `.streamlit/secrets.toml`
It uses **TOML key-value syntax** (not Python code), with quotes around the string value:

```toml
GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"
